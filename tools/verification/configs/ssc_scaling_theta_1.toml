# end_time = 5.0e8, number_of_nodes = 80, atol = 1e-6, rtol = 1e-6, enabled = true, stress_closure_mode = 'lid'
# All units are SI unless otherwise specified.

[solver]
start_time = 0
end_time = 5.0e8
atol = 1e-6
rtol = 1e-6
tsurf_poststep_change = 30
max_steps = 100000

[boundary_conditions]
outer_boundary_condition = 1
outer_boundary_value = 300.0
inner_boundary_condition = 3
inner_boundary_value = 3500.0
emissivity = 1
equilibrium_temperature = 273
core_heat_capacity = 880

[mesh]
outer_radius = 6371000
inner_radius = 3480000
number_of_nodes = 80
mixing_length_profile = "nearest_boundary"
core_density = 10738.332568062382
surface_density = 4090
gravitational_acceleration = 9.81
adiabatic_bulk_modulus = 260e9

[energy]
conduction = true
convection = true
gravitational_separation = false
mixing = false
radionuclides = false
tidal = false

[initial_condition]
surface_temperature = 2200.0
basal_temperature = 3500.0

[phase_liquid]
density = 4000
viscosity = 1e2
heat_capacity = 1000
melt_fraction = 1
thermal_conductivity = 4
thermal_expansivity = 1.0e-5

[phase_solid]
density = 4200
viscosity = 1e21
heat_capacity = 1000
melt_fraction = 0
thermal_conductivity = 4
thermal_expansivity = 1.0e-5
enabled = true
activation_energy = 150000.0
activation_volume = 0.0
activation_volume_decay_pressure = inf
arrhenius_t_ref = 1600.0
viscosity_max_log10 = 40.0
water_prefactor = 1.0
yield_stress_c = 50e6
yield_stress_mu = 0.6
yield_stress_max = 1000e6
yield_switch_width = 0.1
stress_closure_mode = "lid"
interior_flux_fraction = 0.05
lid_base_mode = "rheological"
lid_base_temperature = 1400.0
lid_contrast_coeff = 2.2
lid_mask_width_cells = 1.0
phi_visc_single = 0.5

[phase_mixed]
latent_heat_of_fusion = 4e6
rheological_transition_melt_fraction = 0.4
rheological_transition_width = 0.15
solidus = "data/test/solidus_1d_lookup.dat"
liquidus = "data/test/liquidus_1d_lookup.dat"
phase = "mixed"
phase_transition_width = 0.1
grain_size = 1.0e-3
separation_viscosity = "melt"
cp_blend = "latent"
matprop_smooth_width = 0.0
const_properties = true
const_rho = 4000.0
const_Cp = 1000.0
const_alpha = 1e-5
const_cond = 4.0
const_log10visc = 2.0
const_T_ref = 3500.0
const_S_ref = 3000.0

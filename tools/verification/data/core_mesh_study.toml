# Base config of the CMB mesh study (tools/verification/run_core_mesh_case.py): a solid
# mantle with the stagnant-lid rheology over a core_module core. The run tool sets
# number_of_nodes, cmb_cell_thickness and surface_cell_thickness per run.

[boundary_conditions]
outer_boundary_condition = 5
outer_boundary_value = 273.0
inner_boundary_condition = 1
inner_boundary_value = 0.0
emissivity = 1.0
equilibrium_temperature = 273.0
core_heat_capacity = 880.0
core_bc = "core_module"

[energy]
conduction = true
convection = true
gravitational_separation = false
mixing = false
radionuclides = true
tidal = false
solver_method = "cvode"
use_jax_jacobian = false
kappah_floor = 0.0

[initial_condition]
initial_condition = 1
surface_temperature = 2000.0
basal_temperature = 2000.0

[mesh]
outer_radius = 6371000.0
inner_radius = 3480000.0
number_of_nodes = 80
mixing_length_profile = "nearest_boundary"
core_density = 11924.4
eos_method = 1
surface_density = 4027.8
gravitational_acceleration = 9.81
adiabatic_bulk_modulus = 260000000000.0
adams_williamson_beta = 0.0
surface_pressure = 0.0
mass_coordinates = false
cmb_cell_thickness = 3000.0
surface_cell_thickness = "uniform"

[phase_liquid]
density = 4000.0
viscosity = 100.0
heat_capacity = 1000.0
melt_fraction = 1.0
thermal_conductivity = 4.0
thermal_expansivity = 3e-05

[phase_solid]
density = 4000.0
viscosity = 1.8000000000000003e+20
heat_capacity = 1000.0
melt_fraction = 0.0
thermal_conductivity = 4.0
thermal_expansivity = 3e-05

[phase_solid.rheology]
enabled = true
activation_energy = 226518.5378
activation_volume = 0.0
arrhenius_t_ref = 1773.0
viscosity_max_log10 = 40.0

[phase_mixed]
latent_heat_of_fusion = 400000.0
rheological_transition_melt_fraction = 0.4
rheological_transition_width = 0.15
solidus = "solidus.dat"
liquidus = "liquidus.dat"
phase = "mixed"
phase_transition_width = 0.01
grain_size = 0.001
matprop_smooth_width = 0.01
const_properties = false

[solver]
start_time = 0.0
end_time = 10000000000.0
atol = 1.0e-6
rtol = 1.0e-6
tsurf_poststep_change = 30.0
cvode_output_points = 65


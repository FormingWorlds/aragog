[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "fwl-aragog"
version = "26.05.07"
authors = [
    {name="Dan J. Bower",            email="dbower@ethz.ch"},
    {name="Mariana Sastre",          email="m.c.villamil.sastre@rug.nl"},
    {name="Laurent Soucasse",        email="l.soucasse@esciencecenter.nl"},
    {name="Tim Lichtenberg",         email="tim.lichtenberg@rug.nl"},
    {name="Harrison Nicholls",       email="harrison.nicholls@physics.ox.ac.uk"},
    {name="Hanno Spreeuw",           email="h.spreeuw@esciencecenter.nl"},
    {name="Robb Calder",             email="rdc49@cam.ac.uk"},
]
description = "1-D interior dynamics of rocky mantles that are solid, liquid, or mixed phase"
license = "GPL-3.0-or-later"
readme = "README.md"


[tool.poetry]
packages = [
    { include = "aragog", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10"
attrs = ">=23.1.0"
numpy = ">=2.0.0"
scipy = "^1.12.0"
netCDF4 = "^1.7.0"
thermochem = "^0.8.2"
matplotlib = "^3.8.3"
typed-configparser = "^1.1.0"
typing-extensions = "^4.10.0"
tomli = {version = ">=2.0.0", python = "<3.11"}
setuptools = {version = "70.0.0", optional = true}
click = "^8.1.3"
platformdirs = "^3.10.0"

[tool.poetry.group.test.dependencies]
pytest = ">=8.1"
pytest-cov = ">=1.0.0"
pytest-dependency = ">=1.0.0"
pytest-xdist = ">=3.0.0"


[tool.poetry.group.docs.dependencies]
zensical = ">=0.1.0"
markdown-include = "^0.8"
mkdocstrings = {version = "^0.26", extras = ["python"]}

[tool.poetry.group.jax]
optional = true

[tool.poetry.group.jax.dependencies]
jax = ">=0.4.30"
equinox = ">=0.11.0"

[tool.poetry.extras]
docs = [
    "zensical",
    "markdown-include",
    "mkdocstrings",
]
jax = [
    "jax",
    "equinox",
]

[tool.poetry.scripts]
aragog = "aragog.cli:cli"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external data)",
    "smoke: Integration tests (may need external data)",
    "slow: Slow tests that exercise full multi-Myr solver runs",
]

[tool.coverage.run]
branch = true
source = ["src/aragog"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 96
target-version = "py312"
extend-exclude = ["*ipynb"]

[tool.ruff.lint]
select = [
	"F",  # Pyflakes
	"E",  # pycodestyle (error)
	"W",  # pycodestyle (warning)
    "I",    # isort
]
ignore = [
    "E501", # Line too long
    "E741", # Ambiguous variable name
]

[tool.ruff.lint.isort]
known-first-party=["aragog"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

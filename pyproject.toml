[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fwl-aragog"
dynamic = ["version"]
description = "1-D interior dynamics of rocky mantles that are solid, liquid, or mixed phase"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name="Dan J. Bower",            email="dbower@ethz.ch"},
    {name="Mariana Sastre",          email="m.c.villamil.sastre@rug.nl"},
    {name="Laurent Soucasse",        email="l.soucasse@esciencecenter.nl"},
    {name="Tim Lichtenberg",         email="tim.lichtenberg@rug.nl"},
    {name="Harrison Nicholls",       email="harrison.nicholls@physics.ox.ac.uk"},
    {name="Hanno Spreeuw",           email="h.spreeuw@esciencecenter.nl"},
    {name="Robb Calder",             email="rdc49@cam.ac.uk"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "attrs>=23.1.0",
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "netCDF4>=1.7.0",
    "thermochem>=0.8.2",
    "matplotlib>=3.8.3",
    "typed-configparser>=1.1.0",
    "click>=8.1.3",
    "platformdirs>=3.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1",
    "pytest-cov>=1.0.0",
    "pytest-dependency>=0.6.0",
    "pytest-xdist>=3.0.0",
]
docs = [
    "zensical>=0.0.40",
    "markdown-include>=0.8",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.7",
    "mkdocs-material>=9.5",
]
jax = [
    "jax>=0.4.30",
    "equinox>=0.11.0",
    "scikits-odes-sundials>=3.0.0",
]

[project.scripts]
aragog = "aragog.cli:cli"

[project.urls]
homepage = "https://github.com/FormingWorlds/aragog"
issues = "https://github.com/FormingWorlds/aragog/issues"
documentation = "https://proteus-framework.org/Aragog/"
changelog = "https://github.com/FormingWorlds/aragog/releases"

[tool.setuptools]
package-dir = {"aragog" = "src/aragog"}
include-package-data = true

[tool.setuptools_scm]
# CalVer: tags are bare YY.MM.DD dates (no leading 'v', e.g. 26.05.10).
# setuptools-scm derives the version from the latest git tag.
# version_scheme = "no-guess-dev" is required for CalVer: the default
# "guess-next-dev" would produce 26.5.11.devN+gHASH for commits after
# the 26.05.10 tag, claiming a future calendar date that will collide
# with the next daily release tag. "no-guess-dev" produces
# 26.05.10.post1.devN+gHASH instead, which is honest about the build
# being a post-tag development commit rather than a pre-release of
# the next version.
version_scheme = "no-guess-dev"
version_file = "src/aragog/_version.py"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: Unit tests (fast, no external data)",
    "smoke: Integration tests (may need external data)",
    "integration: Real-physics integration tests against published references",
    "slow: Slow tests that exercise full multi-Myr solver runs",
]

[tool.coverage.run]
branch = true
source = ["aragog"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/__init__.py",
]

[tool.coverage.report]
# Hard 90% coverage gate. 90% is the PROTEUS-ecosystem ceiling:
# the gate does not rise above this value even if real coverage
# exceeds it. Above 90% you are tracking pragma usage and style,
# not bug-finding signal.
fail_under = 90
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise AssertionError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "@abstractmethod",
    "@abc.abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 96
target-version = "py312"
extend-exclude = ["*ipynb"]

[tool.ruff.lint]
select = [
	"F",  # Pyflakes
	"E",  # pycodestyle (error)
	"W",  # pycodestyle (warning)
    "I",    # isort
]
ignore = [
    "E501", # Line too long
    "E741", # Ambiguous variable name
]

[tool.ruff.lint.isort]
known-first-party=["aragog"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

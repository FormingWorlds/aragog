name: item13 probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: item13 ${{ matrix.os }} before=${{ matrix.before }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        before: ['alone', '4', '5', '6', '9', '10', '11', '4,5,6,9,10,11', 'testfile']
        include:
          - os: macos-latest
            before: 'alone'
    # The full suite takes 83-113 min on the 2-vCPU runner with coverage
    # and xdist; 150 min leaves headroom for JAX warmup, conda cache
    # misses, and runner-to-runner timing variance.
    timeout-minutes: 240
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up conda env (sundials from conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: aragog-nightly
          create-args: >-
            python=3.12
            sundials
          condarc: |
            channels:
              - conda-forge

      - name: Install pip-only test deps (scikits-odes-sundials builds against conda SUNDIALS)
        run: |
          pip install pytest pytest-cov pytest-xdist pytest-dependency pytest-timeout hypothesis
          # Direct install of scikits-odes-sundials only; aragog imports
          # CVODE directly from scikits_odes_sundials.cvode and skips the
          # daepack-pulling metapackage. See ci_tests.yml for details.
          # diffrax is the JAX-native ODE solver used by
          # tests/test_jax_entropy.py::TestJAXSolverIntegration; without
          # it those 8 smoke tests fail with ModuleNotFoundError.
          pip install scikits-odes-sundials jax equinox diffrax

      - name: Install aragog
        run: |
          pip install -e .

      - name: Fetch SPIDER EOS test data
        run: |
          mkdir -p /tmp/aragog-test-data
          curl -sL -o /tmp/spider_eos.tar.gz \
            https://github.com/FormingWorlds/aragog/releases/download/test-data-v1/spider_eos_test_data.tar.gz
          tar xzf /tmp/spider_eos.tar.gz -C /tmp/aragog-test-data/
          echo "ARAGOG_TEST_EOS_DIR=/tmp/aragog-test-data/spider_eos" >> $GITHUB_ENV

      - name: Run item 13 probe
        run: |
          if [ "${{ matrix.before }}" = testfile ]; then
            pytest tests/test_core_verification_page.py -p no:xdist -o "addopts=" -s -q --timeout=6000 -m "slow or unit or smoke" || true
          elif [ "${{ matrix.before }}" = alone ]; then
            python item13_probe.py
          else
            python item13_probe.py "${{ matrix.before }}"
          fi

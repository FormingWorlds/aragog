name: Aragog CI Test Suite

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

# Push and PR CI: unit tests only, on ubuntu + macos x py 3.11/3.12/3.13.
# Targets <5 min wall. Slow tests (full multi-Myr CVODE solves) live in
# the scheduled nightly workflow `nightly.yml` instead, alongside coverage
# enforcement against the 85% floor. Running the slow suite or coverage
# instrumentation on every push burns ~10 min CI time per commit and gives
# no bug-finding signal that the unit suite doesn't already cover.
#
# Uses micromamba + conda-forge for the env so SUNDIALS, gfortran, and the
# scikits-odes binary stack come prebuilt instead of being compiled from
# source against stock apt/brew (which lag the SUNDIALS major version
# scikits-odes-sundials 3.x requires).

permissions:
  contents: read
  # actions:read enables `gh run download` to fetch the previous
  # nightly's coverage artifact for the union estimation step.
  actions: read

jobs:
  test-fast:
    name: Aragog-check (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up conda env (sundials from conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: aragog-test
          create-args: >-
            python=${{ matrix.python-version }}
            sundials
          condarc: |
            channels:
              - conda-forge

      - name: Install pip-only test deps (scikits-odes-sundials builds against conda SUNDIALS)
        run: |
          pip install pytest pytest-cov pytest-xdist pytest-dependency ruff
          # Install scikits-odes-sundials directly (skip the scikits-odes
          # metapackage). This avoids scikits-odes-daepack, which is a
          # transitive Fortran dep with f2py incompatibility with numpy
          # 2.3+ and needs gfortran on macOS. aragog imports CVODE
          # directly from scikits_odes_sundials.cvode and has no use for
          # the DAE solvers in the metapackage.
          pip install scikits-odes-sundials jax equinox

      - name: Install aragog
        run: |
          pip install -e .

      - name: Fetch SPIDER EOS test data
        run: |
          mkdir -p /tmp/aragog-test-data
          curl -sL -o /tmp/spider_eos.tar.gz \
            https://github.com/FormingWorlds/aragog/releases/download/test-data-v1/spider_eos_test_data.tar.gz
          tar xzf /tmp/spider_eos.tar.gz -C /tmp/aragog-test-data/
          echo "ARAGOG_TEST_EOS_DIR=/tmp/aragog-test-data/spider_eos" >> $GITHUB_ENV

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Pre-flight fail_under ratchet check
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Reject PRs that lower [tool.coverage.report] fail_under below
          # the value on the base branch. The 95% ceiling is the maximum
          # ratchet per ecosystem policy; this check enforces the
          # one-way-only direction (down forbidden) so the gate cannot be
          # weakened to land an under-tested change.
          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib

          base_ref = os.environ.get('BASE_REF', 'main')
          out = subprocess.run(
              ['git', 'show', f'origin/{base_ref}:pyproject.toml'],
              capture_output=True,
              text=True,
              check=False,
          )
          if out.returncode != 0:
              print(f'Could not read pyproject.toml from origin/{base_ref}; skipping check.')
              sys.exit(0)

          base = tomllib.loads(out.stdout)
          head = tomllib.loads(pathlib.Path('pyproject.toml').read_text())

          def fail_under(d):
              return float(d['tool']['coverage']['report']['fail_under'])

          base_v = fail_under(base)
          head_v = fail_under(head)
          print(f'fail_under: base={base_v} head={head_v}')
          if head_v < base_v:
              print(
                  f'ERROR: fail_under decreased ({head_v} < {base_v}). '
                  'The coverage gate is one-way only; ask a maintainer if a '
                  'downward adjustment is required.'
              )
              sys.exit(1)
          print('OK: fail_under is non-decreasing.')
          PY

      - name: Run unit tests
        run: |
          # --cov-fail-under=0 overrides the 95 % floor in pyproject.toml
          # for this tier only. The unit-only suite measures around 83 %
          # combined coverage; the canonical 95 % gate is enforced in
          # nightly.yml where the unit + smoke + slow tier reaches ~96 %.
          # Coverage data is still emitted as XML and uploaded to Codecov
          # under the `ci` flag for fast-feedback dashboards.
          pytest -m "unit and not slow" -n auto -o "addopts=" \
            -o "junit_family=legacy" --junitxml=junit.xml \
            --cov=src/aragog --cov-report=xml --cov-report=json:coverage.json \
            --cov-fail-under=0

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/Aragog
          files: junit.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/Aragog
          files: coverage.xml
          flags: ci
          fail_ci_if_error: false

      - name: Download last nightly coverage artifact
        id: download-nightly
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # First-party-only path to cross-workflow artifact download:
          # query the latest successful nightly run on main, then use
          # `gh run download`. Failures here do not break the PR (the
          # union step downgrades to "nightly missing" warning).
          set +e
          mkdir -p nightly-coverage
          RUN_ID=$(gh run list \
              --workflow=nightly.yml \
              --branch=main \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId' \
              -R ${{ github.repository }})
          if [ -z "$RUN_ID" ]; then
            echo "No successful nightly run found on main."
            echo "nightly_missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading artifact from nightly run $RUN_ID"
          gh run download "$RUN_ID" \
              --name nightly-coverage \
              --dir nightly-coverage \
              -R ${{ github.repository }}
          if [ ! -f nightly-coverage/coverage.json ]; then
            echo "Artifact missing coverage.json; treating as missing."
            echo "nightly_missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "nightly_missing=false" >> "$GITHUB_OUTPUT"
          echo "nightly_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Estimate combined coverage union
        id: coverage-union
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        env:
          NIGHTLY_MISSING: ${{ steps.download-nightly.outputs.nightly_missing }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib
          from datetime import datetime, timezone

          GRACE_PERIOD = 0.3  # percent; coverage drops below this do not block
          STALE_HOURS = 48

          def read_totals(path):
              try:
                  with open(path) as fh:
                      data = json.load(fh)
                  t = data.get('totals', {})
                  return (
                      t.get('percent_covered', 0.0),
                      t.get('covered_lines', 0),
                      t.get('num_statements', 0),
                  )
              except Exception:
                  return 0.0, 0, 0

          def norm_path(p):
              p = p.replace('\\', '/')
              if 'src/' in p:
                  return p.split('src/', 1)[-1]
              return p

          def line_set_executed(data):
              out = set()
              for path, fd in data.get('files', {}).items():
                  n = norm_path(path)
                  for line in fd.get('executed_lines', []) or []:
                      out.add((n, line))
              return out

          def line_set_executable(data):
              out = set()
              for path, fd in data.get('files', {}).items():
                  n = norm_path(path)
                  exec_ = fd.get('executed_lines', []) or []
                  miss_ = fd.get('missing_lines', []) or []
                  for line in exec_ + miss_:
                      out.add((n, line))
              return out

          # Threshold: source of truth is pyproject.toml.
          full_threshold = 95.0
          try:
              data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
              full_threshold = float(
                  data['tool']['coverage']['report']['fail_under']
              )
          except Exception as exc:
              print(f'WARN: could not read fail_under from pyproject.toml: {exc}')

          # Unit-tier coverage from this PR.
          u_pct, u_covered, u_total = read_totals('coverage.json')
          u_data = {}
          if pathlib.Path('coverage.json').exists():
              try:
                  u_data = json.loads(pathlib.Path('coverage.json').read_text())
              except Exception:
                  pass

          # Nightly full-suite coverage.
          n_path = pathlib.Path('nightly-coverage/coverage.json')
          n_pct, n_covered, n_total = read_totals(n_path)
          n_data = {}
          if n_path.exists():
              try:
                  n_data = json.loads(n_path.read_text())
              except Exception:
                  pass

          # Staleness check.
          ts_path = pathlib.Path('nightly-coverage/nightly-timestamp.txt')
          stale = False
          stale_hours = None
          if ts_path.exists():
              try:
                  ts_str = ts_path.read_text().strip().replace('Z', '+00:00')
                  ts = datetime.fromisoformat(ts_str)
                  age = datetime.now(timezone.utc) - ts
                  stale_hours = age.total_seconds() / 3600.0
                  stale = stale_hours > STALE_HOURS
              except Exception:
                  pass

          missing = os.environ.get('NIGHTLY_MISSING', 'false') == 'true'
          missing = missing or not n_data

          # Union estimate.
          est_pct = None
          est_covered = 0
          est_total = 0
          if u_data.get('files') and n_data.get('files'):
              union_exec = line_set_executed(u_data) | line_set_executed(n_data)
              union_all = line_set_executable(u_data) | line_set_executable(n_data)
              if union_all:
                  est_covered = len(union_exec)
                  est_total = len(union_all)
                  est_pct = min(100.0, 100.0 * est_covered / est_total)

          # Status: ok / warn / fail relative to full threshold + grace.
          status = 'ok'
          drop = 0.0
          if est_pct is not None:
              drop = full_threshold - est_pct
              if drop > GRACE_PERIOD:
                  status = 'fail'
              elif drop > 0:
                  status = 'warn'

          summary_lines = [
              '## Coverage estimate (PR vs nightly union)',
              '',
              f'- Unit (this PR): **{u_pct:.2f}%** ({u_covered}/{u_total} stmts)',
          ]
          if missing:
              summary_lines.append('- Nightly artifact: **MISSING** (no successful nightly on main)')
          else:
              age_str = f' ({stale_hours:.1f}h old)' if stale_hours is not None else ''
              tag = ' [STALE]' if stale else ''
              summary_lines.append(
                  f'- Nightly: **{n_pct:.2f}%** ({n_covered}/{n_total}){age_str}{tag}'
              )
          if est_pct is not None:
              summary_lines.append(
                  f'- Estimated union: **{est_pct:.2f}%** ({est_covered}/{est_total})'
              )
              summary_lines.append(f'- Threshold: {full_threshold:.2f}% | drop: {drop:+.2f}% | status: **{status}**')
          else:
              summary_lines.append('- Union estimate unavailable (one or both JSONs missing).')
          if missing or stale:
              summary_lines.append('')
              summary_lines.append('> Nightly missing or stale; union number is informational only and does not gate this PR.')

          summary_md = '\n'.join(summary_lines) + '\n'
          print(summary_md)
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a') as fh:
                  fh.write(summary_md)

          out = os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out, 'a') as fh:
                  fh.write(f'unit_pct={u_pct:.2f}\n')
                  fh.write(f'nightly_pct={n_pct:.2f}\n')
                  fh.write(f'est_pct={est_pct:.2f}\n' if est_pct is not None else 'est_pct=\n')
                  fh.write(f'est_covered_union={est_covered}\n')
                  fh.write(f'est_total_union={est_total}\n')
                  fh.write(f'coverage_status={status}\n')
                  fh.write(f'coverage_drop={drop:.2f}\n')
                  fh.write(f'nightly_stale={"true" if stale else "false"}\n')
                  fh.write(f'nightly_missing={"true" if missing else "false"}\n')

          # Informational only on this branch; never fails the job.
          # Future tightening can flip to sys.exit(1) when status == 'fail'.
          PY

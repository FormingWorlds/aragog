name: Claude PR review

# Reviews a pull request when it opens, reopens or becomes ready for review, and on a PR comment
# whose first line is "@claude review" ("@claude deep-review" runs the larger model). A find pass
# and a verify pass return findings; .github/scripts/review_decision.py posts them and sets the status.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pending:
    name: Mark new commits as not reviewed
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set Claude review to pending on the new head
        continue-on-error: true  # the token of a fork or bot pull request cannot write statuses
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context='Claude review' -f description='new commits: comment @claude review' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  review:
    name: Claude PR review
    if: >-
      (github.event_name == 'pull_request'
        && github.event.action != 'synchronize'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.type != 'Bot')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@claude ')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      MODEL: ${{ (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude deep-review')) && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Skip closed, draft, fork and bot pull requests
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = issue_comment ] && ! head -n 1 <<<"$BODY" | grep -qE '^@claude (deep-)?review[[:space:]]*$'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,isCrossRepository,headRefOid,baseRefOid,author)
          echo "$pr"
          if [ "$(jq -r '.state != "OPEN" or .isDraft or .isCrossRepository or .author.is_bot' <<<"$pr")" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No review: the pull request is closed, a draft, from a fork or by a bot." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/pull/$PR_NUMBER/merge" --jq .object.sha); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No review: GitHub has no merge commit for this pull request (merge conflict, or not yet computed); comment @claude review to retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "run=true"; echo "sha=$sha"; jq -r '"head=\(.headRefOid)\nbase=\(.baseRefOid)"' <<<"$pr"; } >> "$GITHUB_OUTPUT"

      - name: Mark the head as under review
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending \
            -f context='Claude review' -f description='review running' -f target_url="$RUN_URL"

      - name: Check out the merge commit of the pull request
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check that the merge commit holds the head
        id: merge
        if: steps.gate.outputs.run == 'true'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head }}
        run: |
          if [ "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ]; then
            echo "::error::the merge commit of the pull request is not built on its head $HEAD_SHA yet"
            exit 1
          fi

      - name: Check out the base branch for reading
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ steps.gate.outputs.base }}
          path: .review_base
          persist-credentials: false

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Lint the changed lines
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          python -m pip install --quiet ruff
          python -I - <<'PY'
          import os, re, subprocess
          added, out = {}, []
          try:
              diff = subprocess.run(['git', 'diff', 'HEAD^1', 'HEAD'],
                                    capture_output=True, check=True).stdout
              f, n, header = None, 0, False
              for line in diff.decode('utf-8', 'replace').splitlines():
                  if line.startswith('diff --git '):
                      f, header = None, True
                  elif header:
                      if line.startswith('+++ '):
                          name, header = line[4:].rstrip('\t'), False
                          f = name[2:] if name.startswith('b/') and name.endswith('.py') else None
                          if name.startswith('"'):
                              out.append(f'not linted (quoted name): {name}')
                  elif m := re.match(r'@@ -\S+ \+(\d+)', line):
                      n = int(m[1])
                  elif f and line.startswith('+'):
                      added.setdefault(f, set()).add(n)
                      n += 1
                  elif line.startswith(' '):
                      n += 1
              files = [f for f in added if os.path.isfile(f)]
              ruff = subprocess.run(['ruff', 'check', '--output-format', 'concise', *files],
                                    capture_output=True).stdout.decode('utf-8', 'replace')
              for line in ruff.splitlines() if files else []:
                  m = re.match(r'(.+?):(\d+):\d+: ', line)
                  if m and int(m[2]) in added.get(m[1], ()):
                      out.append('ruff ' + line)
              for f in files:
                  run = []
                  with open(f, encoding='utf-8', errors='replace') as fh:
                      lines = fh.read().splitlines()
                  for i, text in enumerate(lines + [''], 1):
                      if text.lstrip().startswith('#'):
                          run.append(i)
                          continue
                      if len(run) > 3 and added[f] & set(run):
                          out.append(f'comment block {f}:{run[0]}-{run[-1]}: {len(run)} lines')
                      run = []
          except Exception as err:
              out.append(f'lint step failed: {err!r}')
          text = '\n'.join(out) or 'no lint items in the changed lines'
          with open('.review_lint.txt', 'w') as fh:
              fh.write(text + '\n')
          print(text)
          PY

      - name: Install the sandbox of the agent's shell
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap socat

      - name: Collect the review threads of this workflow
        id: script
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/review"
          mkdir -p "$d"
          if [ -f .review_base/.github/scripts/review_decision.py ]; then
            cp .review_base/.github/scripts/review_decision.py "$d/"
            cp .review_base/.github/review-policy.yml "$d/" 2>/dev/null || true
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cp .github/scripts/review_decision.py "$d/"
            echo "no_approve=--no-approve" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the base branch has no .github/scripts/review_decision.py"
            exit 1
          fi
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          python -I "$d/review_decision.py" collect --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --out "$d/collect.json"
          jq '.threads' "$d/collect.json" | tee .review_threads.json

      - name: Find
        id: find
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 12
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request of aragog, the interior evolution module of PROTEUS.
            First read AGENTS.md and tests/AGENTS.md of the repository. Then read the diff
            with `gh pr diff ${{ env.PR_NUMBER }}` and the files it touches. The working tree
            is the merge commit; ./.review_base/ holds the base branch.

            Return every finding with one severity:
            - "important": a bug the pull request adds that must be fixed before merge: a wrong
              result or a crash if merged (name the input or state that triggers it), a physics
              or unit error, a test or guard that the change removes or weakens, a doc or
              docstring that states wrong behaviour;
            - "pre_existing": a bug of the same kind that is already on the base branch, in code
              the pull request touches or calls;
            - "nit": a minor item in the lines the pull request adds or changes: an unused import
              or variable, dead code, duplicated logic, an error-prone pattern, and each line of
              ./.review_lint.txt (ruff violations and inline comment blocks longer than 3 lines).
              If that file is missing or reports a failure, say in the summary that the lint did
              not run.
            Apart from those, do not comment on style, naming, formatting or comment length. Give
            each finding the file path, the line as `gh pr diff` numbers it on the new side, a
            short title and a body with the concrete input or state that fails. At most 8 findings.

            ./.review_threads.json lists the findings of earlier reviews (key, severity, path,
            line, text, resolved). Do not report one of them again. Put the key of each open one
            (resolved false) that the current code fixes into `fixed`.

            `summary`: 2 to 5 plain, short sentences on what the pull request does and what
            you found. Do not post anything to GitHub; the workflow posts your output.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 30
            --allowedTools "Read(./**),Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["important","pre_existing","nit"]},"path":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"},"body":{"type":"string"}},"required":["severity","path","line","title","body"]}},"fixed":{"type":"array","items":{"type":"string"}}},"required":["summary","findings","fixed"]}'

      - name: Number the candidate findings
        if: steps.gate.outputs.run == 'true'
        env:
          FIND: ${{ steps.find.outputs.structured_output }}
          D: ${{ steps.script.outputs.dir }}
        run: |
          printf '%s' "$FIND" > "$D/find.json"
          python -I "$D/review_decision.py" prep --find "$D/find.json" --collect "$D/collect.json" --out "$D/candidates.json"
          jq '.verify_in' "$D/candidates.json" | tee .review_verify_in.json

      - name: Verify
        id: verify
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 6
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Check the candidate findings of a review of this pull request of aragog against the
            code. ./.review_verify_in.json holds `candidates` (id, severity, path, line, title,
            body) and `fixed` (keys of earlier findings in ./.review_threads.json, with their
            text, that the reviewer says the current code fixes). The working tree is the merge
            commit, ./.review_base/ holds the base branch, and `gh pr diff ${{ env.PR_NUMBER }}`
            shows the change.

            Give exactly one verdict for each candidate id. `verified` is true only when you can
            point to the code that makes the claim true and the severity is right: "important"
            needs the pull request to add the bug, "pre_existing" needs the bug on the base
            branch. Else false, with the reason. For each key in `fixed`, `verified` is true only
            when the code no longer has the problem that the earlier finding's text describes.
            Do not post anything to GitHub.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 15
            --allowedTools "Read(./**),Grep,Glob,Bash(gh pr diff:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
            --json-schema '{"type":"object","properties":{"verdicts":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"verified":{"type":"boolean"},"reason":{"type":"string"}},"required":["id","verified","reason"]}},"fixed":{"type":"array","items":{"type":"object","properties":{"key":{"type":"string"},"verified":{"type":"boolean"},"reason":{"type":"string"}},"required":["key","verified","reason"]}}},"required":["verdicts","fixed"]}'

      - name: Decide and post
        id: post
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ steps.verify.outputs.structured_output }}
          D: ${{ steps.script.outputs.dir }}
          NO_APPROVE: ${{ steps.script.outputs.no_approve }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
        run: |
          printf '%s' "$VERIFY" > "$D/verify.json"
          git diff --raw -z -M HEAD^1 HEAD > "$D/raw"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" > "$D/files.json"
          python -I "$D/review_decision.py" plan --find "$D/find.json" --verify "$D/verify.json" \
            --candidates "$D/candidates.json" --collect "$D/collect.json" --raw "$D/raw" \
            --files "$D/files.json" --head "$HEAD_SHA" --policy "$D/review-policy.yml" \
            --out "$D/plan.json" $NO_APPROVE
          jq '{state, description, event, resolve, dismiss, comments: (.comments | length)}' "$D/plan.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python -I "$D/review_decision.py" apply --plan "$D/plan.json" --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" --url "$RUN_URL"

      - name: Report a failed review
        if: (failure() || cancelled()) && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == "Claude review")][0].target_url')
          if [ "$last" != "$RUN_URL" ]; then
            echo "A newer run owns the status of $HEAD_SHA; nothing to report."
            exit 0
          fi
          failed=$(jq -r 'to_entries | map(select(.value.outcome == "failure")) | first | .key // "job"' <<<"$STEPS")
          case "$failed" in
            merge) cause="the merge commit is not built on the head yet" ;;
            find|verify) cause="the $failed pass failed (seat limit, timeout or no output)" ;;
            post) cause="the decision or post step failed" ;;
            *) cause="the review job failed ($failed)" ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=failure \
            -f context='Claude review' -f description="$cause; comment @claude review to retry" \
            -f target_url="$RUN_URL"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            | jq -r '.[][] | select(.state == "APPROVED" and .user.login == "github-actions[bot]"
                and ((.body // "") | contains("<!-- claude-review:approval -->"))) | .id' \
            | while read -r id; do
                gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$id/dismissals" \
                  -f message='A later review run failed.' -f event=DISMISS
              done

      - name: Report model, turns and time
        if: always() && (steps.find.outputs.execution_file != '' || steps.verify.outputs.execution_file != '')
        continue-on-error: true
        env:
          EXEC_FIND: ${{ steps.find.outputs.execution_file }}
          EXEC_VERIFY: ${{ steps.verify.outputs.execution_file }}
        run: |
          for e in "$EXEC_FIND" "$EXEC_VERIFY"; do
            if [ -n "$e" ]; then
              jq -r --arg m "$MODEL" '[.[] | select(.type == "result")] | last
                | "model \($m), turns \(.num_turns), wall \(.duration_ms / 1000) s, API \(.duration_api_ms / 1000) s"' "$e" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

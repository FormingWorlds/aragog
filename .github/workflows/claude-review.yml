name: Claude PR review

# Reviews a pull request when it opens, reopens or becomes ready for review, and again on
# a PR comment with "@claude" ("@claude deep-review" runs the larger model). The job can
# read the repository and write PR comments; it cannot push or commit.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    name: Claude PR review
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.type != 'Bot')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      MODEL: ${{ (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude deep-review')) && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
    steps:
      - name: Skip closed, draft and fork pull requests
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,isCrossRepository,headRefOid)
          echo "$pr"
          if [ "$(jq -r '.state != "OPEN" or .isDraft or .isCrossRepository' <<<"$pr")" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No review: the pull request is closed, a draft or from a fork." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/pull/$PR_NUMBER/merge" --jq .object.sha); then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(jq -r .headRefOid <<<"$pr")" >> "$GITHUB_OUTPUT"
            echo "No merge commit (merge conflict): the review reads the head commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the pull request
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Lint the changed lines
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet ruff
          python - <<'PY'
          import os, re, subprocess
          added, out = {}, []
          try:
              diff = subprocess.run(['gh', 'pr', 'diff', os.environ['PR_NUMBER']],
                                    capture_output=True, check=True).stdout
              f, n = None, 0
              for line in diff.decode('utf-8', 'replace').splitlines():
                  if line.startswith('+++ '):
                      name = line[4:].rstrip('\t')
                      f = name[2:] if name.startswith('b/') and name.endswith('.py') else None
                      if name.startswith('"'):
                          out.append(f'not linted (quoted name): {name}')
                  elif m := re.match(r'@@ -\S+ \+(\d+)', line):
                      n = int(m[1])
                  elif f and line.startswith('+'):
                      added.setdefault(f, set()).add(n)
                      n += 1
                  elif line.startswith(' '):
                      n += 1
              files = [f for f in added if os.path.isfile(f)]
              ruff = subprocess.run(['ruff', 'check', '--output-format', 'concise', *files],
                                    capture_output=True).stdout.decode('utf-8', 'replace')
              for line in ruff.splitlines() if files else []:
                  m = re.match(r'(.+?):(\d+):\d+: ', line)
                  if m and int(m[2]) in added.get(m[1], ()):
                      out.append('ruff ' + line)
              for f in files:
                  run = []
                  with open(f, encoding='utf-8', errors='replace') as fh:
                      lines = fh.read().splitlines()
                  for i, text in enumerate(lines + [''], 1):
                      if text.lstrip().startswith('#'):
                          run.append(i)
                          continue
                      if len(run) > 3 and added[f] & set(run):
                          out.append(f'comment block {f}:{run[0]}-{run[-1]}: {len(run)} lines')
                      run = []
          except Exception as err:
              out.append(f'lint step failed: {err!r}')
          with open('.review_lint.txt', 'w') as fh:
              fh.write('\n'.join(out) + '\n')
          print('\n'.join(out) or 'no lint items in the changed lines')
          PY

      - name: Review the pull request
        id: claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request of aragog, the interior evolution module of PROTEUS.
            First read AGENTS.md and tests/AGENTS.md of the repository. Then read the diff
            with `gh pr diff ${{ env.PR_NUMBER }}` and the files it touches.

            Section 1, "Findings": report only real items:
            - a wrong result or a crash if the change is merged, with the input or state
              that triggers it;
            - a physics or unit error;
            - a test or guard that the change removes or weakens;
            - a doc or docstring that states wrong behaviour.
            At most 5 findings, each with the file, the line and a concrete input or
            state that fails.

            Section 2, "Code quality": reliability and maintainability items in the lines
            the pull request adds or changes only, for example an unused import or
            variable, unreachable or dead code, duplicated logic, a function that grew too
            complex, or an error-prone pattern (bare except, mutable default argument,
            resource leak, comparison that is always true or false). At most 5 items, each
            with the file, the line and the concrete risk. Keep them apart from section 1.

            Section 2 also lists each line of ./.review_lint.txt: ruff violations of the
            repository's rules and inline comment blocks longer than 3 lines, both in the
            changed lines only. These count toward the 5 items; if there are more, list the
            5 most important and give the total count. If the file is missing or reports a
            failure, say that the lint did not run.

            Apart from those 2 rules, do not comment on style, naming, formatting or
            comment length. Put an item on its line with the inline comment tool when the line
            is in the diff. Return the summary with the 2 sections as the `summary` field of
            your structured output, in GitHub markdown; the workflow posts it as one PR
            comment. If a section has nothing real, say so in one line. Write in plain,
            short sentences.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 30
            --allowedTools "Read(./**),Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'

      - name: Post the review summary
        if: steps.claude.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ fromJSON(steps.claude.outputs.structured_output).summary }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$SUMMARY"

      - name: Report model, turns and time
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r --arg m "$MODEL" '[.[] | select(.type == "result")] | last
            | "model \($m), turns \(.num_turns), wall \(.duration_ms / 1000) s, API \(.duration_api_ms / 1000) s"' "$EXEC" \
            | tee -a "$GITHUB_STEP_SUMMARY"

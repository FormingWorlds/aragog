name: Fixture Spread

on:
  push:
    branches: [tl/ssc-step1-fixture-spread]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spread:
    name: spread-ubuntu (rep ${{ matrix.rep }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up conda env (sundials from conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: aragog-fixture-spread
          create-args: >-
            python=3.12
            sundials
          condarc: |
            channels:
              - conda-forge

      - name: Install pip test dependencies
        run: |
          pip install pytest pytest-cov pytest-xdist pytest-dependency "pytest-timeout>=2.3"
          pip install scikits-odes-sundials jax equinox diffrax

      - name: Install aragog
        run: |
          pip install -e .

      - name: Fetch SPIDER EOS test data
        run: |
          mkdir -p /tmp/aragog-test-data
          curl -sL -o /tmp/spider_eos.tar.gz \
            https://github.com/FormingWorlds/aragog/releases/download/test-data-v1/spider_eos_test_data.tar.gz
          tar xzf /tmp/spider_eos.tar.gz -C /tmp/aragog-test-data/
          echo "ARAGOG_TEST_EOS_DIR=/tmp/aragog-test-data/spider_eos" >> $GITHUB_ENV

      - name: Print environment and hardware diagnostics
        run: |
          echo "=== CPU INFO ==="
          lscpu
          echo "=== PACKAGE VERSIONS ==="
          python -c "import numpy, jax, scikits.odes, sys; print('numpy:', numpy.__version__, 'jax:', jax.__version__, 'scikits.odes:', getattr(scikits.odes, '__version__', 'unknown'), 'platform:', sys.platform)"

      - name: Generate golden fixtures
        run: |
          python -c "import tools.verification.generate_golden_fixtures as g; g.check_clean_git_tree = lambda: None; g.main()"
          mkdir -p output_fixtures
          cp tests/reference/*.npz output_fixtures/

      - name: Upload fixtures artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixtures-rep${{ matrix.rep }}
          path: output_fixtures/*.npz

name: Aragog nightly

on:
  schedule:
    # 02:30 UTC daily (offset from Zalmoxis 02:00 UTC to spread runner load).
    - cron: "30 2 * * *"
  # Refresh the canonical (full-suite) Codecov upload on every push to main
  # so the badge tracks the merged state of the repo, not just the last cron.
  push:
    branches: [main]
  # Manual trigger for ad-hoc runs (e.g. before cutting a release, or to
  # verify the suite on a feature branch via
  # `gh workflow run "Aragog nightly" -r <branch>`).
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents. Coverage
# upload uses the CODECOV_TOKEN secret directly, not the default
# GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: the unit, smoke and slow tiers with coverage in 2 parts and the 90 % gate of
# [tool.coverage.report] on their combined data; over an hour on a 2-vCPU runner, so not run on
# push or PR. micromamba with conda-forge provides SUNDIALS, gfortran and scikits-odes prebuilt.
jobs:
  nightly:
    # The core verification page test runs in one process on its own runner: in an xdist worker
    # its item 13 run crashes the worker, and its values depend on the process history.
    name: Aragog-nightly ${{ matrix.part }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [main, core-verification]
    # With coverage on the 2-vCPU runner the tests of the main part took 58-98 min in 6 runs and
    # those of the core verification part 23-36 min in 8; 150 min leaves headroom for JAX warmup,
    # conda cache misses, and runner-to-runner timing variance.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up conda env (sundials from conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: aragog-nightly
          create-args: >-
            python=3.12
            sundials
          condarc: |
            channels:
              - conda-forge

      - name: Install pip-only test deps (scikits-odes-sundials builds against conda SUNDIALS)
        run: |
          pip install pytest pytest-cov pytest-xdist pytest-dependency pytest-timeout hypothesis "proteus-mpl>=1.5.0"
          # Direct install of scikits-odes-sundials only; aragog imports
          # CVODE directly from scikits_odes_sundials.cvode and skips the
          # daepack-pulling metapackage. See ci_tests.yml for details.
          # diffrax is the JAX-native ODE solver used by
          # tests/test_jax_entropy.py::TestJAXSolverIntegration; without
          # it those 8 smoke tests fail with ModuleNotFoundError.
          pip install scikits-odes-sundials jax equinox diffrax

      - name: Install aragog
        run: |
          pip install -e .

      - name: Fetch SPIDER EOS test data
        run: |
          mkdir -p /tmp/aragog-test-data
          curl -sL -o /tmp/spider_eos.tar.gz \
            https://github.com/FormingWorlds/aragog/releases/download/test-data-v1/spider_eos_test_data.tar.gz
          tar xzf /tmp/spider_eos.tar.gz -C /tmp/aragog-test-data/
          echo "ARAGOG_TEST_EOS_DIR=/tmp/aragog-test-data/spider_eos" >> $GITHUB_ENV

      - name: Print the CPU model
        run: lscpu | grep 'Model name'

      - name: Write the EOS table cache without coverage
        run: |
          # under coverage the parse of the tables is about 45 times slower, once in each xdist worker
          python -c 'import os; from aragog.eos.entropy import EntropyEOS; from aragog.jax.eos import EntropyEOS_JAX; d = os.environ["ARAGOG_TEST_EOS_DIR"]; EntropyEOS(d); EntropyEOS_JAX(d)'
          ls "$ARAGOG_TEST_EOS_DIR"/*.cache.npz

      - name: Run unit + smoke + slow tests with coverage
        if: matrix.part == 'main'
        run: |
          # -n auto runs xdist workers; pytest-cov combines their data into .coverage. -ra prints
          # the failed, errored and skipped tests at the end, also for a cancelled run.
          pytest -m "unit or smoke or integration or slow" -n auto -o "addopts=" -ra \
            --ignore=tests/test_core_verification_page.py \
            --timeout=2700 --timeout-method=thread --durations=30 \
            --cov=aragog --cov-report=term-missing --cov-fail-under=0

      - name: Run the core verification page test in one process
        if: matrix.part == 'core-verification'
        run: |
          # 4500 s per test: 2.7 times the longest item 13 call of this part in 4 runs (1648 s)
          pytest tests/test_core_verification_page.py -m "unit or smoke or integration or slow" \
            -p no:xdist -o "addopts=" -ra --timeout=4500 --timeout-method=thread --durations=10 \
            --cov=aragog --cov-report=term-missing --cov-fail-under=0

      - name: Keep the coverage data
        if: ${{ !cancelled() }}
        run: mv .coverage cov-${{ matrix.part }}.dat

      - name: Upload the coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cov-${{ matrix.part }}
          path: cov-${{ matrix.part }}.dat

  coverage:
    # The 90 % gate of [tool.coverage.report] on the combined data of both parts
    name: Aragog-nightly coverage
    needs: nightly
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: cov-*
          merge-multiple: true

      - name: Combine and check the coverage
        run: |
          pip install "coverage[toml]>=7.6"
          pip install --no-deps -e .
          coverage combine cov-main.dat cov-core-verification.dat
          # the vnv tests also measure modules they write to pytest tmp folders; the XML is
          # written before the gate, so Codecov gets it also on a night below 90 %
          coverage xml --include='*/src/aragog/*' --fail-under=0
          coverage report --include='*/src/aragog/*'

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/Aragog
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false

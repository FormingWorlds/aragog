name: Aragog nightly

on:
  schedule:
    # 02:30 UTC daily (offset from Zalmoxis 02:00 UTC to spread runner load).
    - cron: "30 2 * * *"
  # Manual trigger for ad-hoc runs (e.g. before cutting a release, or to
  # verify the suite on a feature branch via
  # `gh workflow run "Aragog nightly" -r <branch>`).
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents. Coverage
# upload uses the CODECOV_TOKEN secret directly, not the default
# GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: full unit + slow suite with coverage instrumentation and the
# 85% floor enforced via [tool.coverage.report].fail_under in pyproject.toml.
# Excluded from push and PR CI because the slow tier alone takes ~110 s and
# coverage instrumentation pushes the full run to ~10 min on a 2-vCPU
# runner, over the 5 min budget for fast CI.
#
# Uses micromamba + conda-forge for the env so SUNDIALS, gfortran, and the
# scikits-odes binary stack come prebuilt.
jobs:
  nightly:
    name: Aragog-nightly (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up conda env (sundials + gfortran + pinned numpy)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: aragog-nightly
          # numpy pinned to <2.3 for scikits-odes-daepack 3.0.0 source-
          # build f2py compatibility (see ci_tests.yml for details).
          create-args: >-
            python=3.12
            sundials
            gfortran
            numpy<2.3
          condarc: |
            channels:
              - conda-forge

      - name: Install pip-only test deps (scikits-odes builds against conda SUNDIALS)
        run: |
          pip install pytest pytest-cov pytest-xdist pytest-dependency
          # PEP 517 build isolation gives the build env a fresh numpy.
          # PIP_CONSTRAINT forces it to match conda's pinned numpy<2.3 so
          # scikits-odes-daepack's f2py-generated C compiles.
          echo "numpy<2.3" > /tmp/build-constraints.txt
          PIP_CONSTRAINT=/tmp/build-constraints.txt \
            pip install scikits-odes scikits-odes-sundials jax equinox

      - name: Install aragog
        run: |
          pip install -e .

      - name: Run unit + slow tests with coverage
        run: |
          pytest -m "unit or slow" -o "addopts=" \
            --cov=src/aragog --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/Aragog
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false
